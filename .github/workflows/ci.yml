name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: urban-air-quality-assistant/backend
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        working-directory: urban-air-quality-assistant/backend
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: urban-air-quality-assistant/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: urban-air-quality-assistant/frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: urban-air-quality-assistant/frontend
        run: npm test
      - name: Build frontend
        working-directory: urban-air-quality-assistant/frontend
        run: npm run build
      - name: Lint frontend
        working-directory: urban-air-quality-assistant/frontend
        run: npm run lint
